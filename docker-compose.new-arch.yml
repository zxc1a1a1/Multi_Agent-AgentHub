      DOCUMENT_AGENT_ADDR: ":8080"
      DOCUMENT_AGENT_PUBLIC_URL: "http://document-agent-new:8080"
      DOCUMENT_AGENT_LLM_PROVIDER: "${DOCUMENT_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      DOCUMENT_AGENT_LLM_MODEL: "${DOCUMENT_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      DOCUMENT_AGENT_LLM_API_KEY: "${DOCUMENT_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      DOCUMENT_AGENT_LLM_BASE_URL: "${DOCUMENT_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
    ports:
