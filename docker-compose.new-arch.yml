volumes:
  gateway-data:
  mysql-data:
  orchestrator-artifacts:
  s3-data:
  prometheus-data:
  alertmanager-data:
  alerts-data:

services:
  # =========================================================================
  # MySQL 8.4 — authoritative state
  # =========================================================================
  mysql:
    image: "mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "agenthub"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # =========================================================================
  # Redis 7.2 — auxiliary cache / short-lived event replica
  # =========================================================================
  redis:
    image: "redis:7.2-alpine@sha256:2c933526722b4126a61d5c170f766dc159adf97682f0b1cbbc27b1666ba96d84"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # =========================================================================
  # S3-compatible object store (objectstore profile)
  # Artifact blobs + metadata move here when ARTIFACT_S3_ENDPOINT points at it.
  # The S3 API is the contract; SeaweedFS is used because the MinIO images are
  # no longer resolvable from the registries available to this environment.
  # Set ARTIFACT_S3_ENDPOINT=http://s3-objectstore:8333 to enable; the default
  # boot path keeps using the local artifact volume.
  # =========================================================================
  s3-objectstore:
    image: "chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860"
    profiles: ["objectstore"]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    ports:
      - "9000:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/"]
      interval: 10s
      timeout: 3s
      retries: 12
  # =========================================================================
  # 10 Specialist Agents (ports 8081–8090)
  # =========================================================================

  code-agent-new:
    build:
      context: .
      dockerfile: services/agents/code-agent/Dockerfile
    environment:
      CODE_AGENT_ADDR: ":8080"
      CODE_AGENT_PUBLIC_URL: "http://code-agent-new:8080"
      CODE_AGENT_LLM_PROVIDER: "${CODE_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      CODE_AGENT_LLM_MODEL: "${CODE_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      CODE_AGENT_LLM_API_KEY: "${CODE_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      CODE_AGENT_LLM_BASE_URL: "${CODE_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
      ORCHESTRATOR_TOOL_AUTHORIZE_URL: "http://orchestrator-new:8080/internal/orchestrator/tools/authorize"
      ORCHESTRATOR_TOOL_RESULT_URL: "http://orchestrator-new:8080/internal/orchestrator/tools/result"
      ORCHESTRATOR_HANDOFF_URL: "http://orchestrator-new:8080/internal/orchestrator/tools/handoff"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  web-agent-new:
    build:
      context: .
      dockerfile: services/agents/web-agent/Dockerfile
    environment:
      WEB_AGENT_ADDR: ":8080"
      WEB_AGENT_PUBLIC_URL: "http://web-agent-new:8080"
      WEB_AGENT_LLM_PROVIDER: "${WEB_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      WEB_AGENT_LLM_MODEL: "${WEB_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      WEB_AGENT_LLM_API_KEY: "${WEB_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      WEB_AGENT_LLM_BASE_URL: "${WEB_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
      ORCHESTRATOR_TOOL_AUTHORIZE_URL: "http://orchestrator-new:8080/internal/orchestrator/tools/authorize"
      ORCHESTRATOR_TOOL_RESULT_URL: "http://orchestrator-new:8080/internal/orchestrator/tools/result"
      ORCHESTRATOR_RENDER_URL: "http://orchestrator-new:8080/internal/orchestrator/render"
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  document-agent-new:
    build:
      context: .
      dockerfile: services/agents/document-agent/Dockerfile
    environment:
      DOCUMENT_AGENT_ADDR: ":8080"
      DOCUMENT_AGENT_PUBLIC_URL: "http://document-agent-new:8080"
      DOCUMENT_AGENT_LLM_PROVIDER: "${DOCUMENT_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      DOCUMENT_AGENT_LLM_MODEL: "${DOCUMENT_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      DOCUMENT_AGENT_LLM_API_KEY: "${DOCUMENT_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      DOCUMENT_AGENT_LLM_BASE_URL: "${DOCUMENT_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  vision-agent-new:
    build:
      context: .
      dockerfile: services/agents/vision-agent/Dockerfile
    environment:
      VISION_AGENT_ADDR: ":8080"
      VISION_AGENT_PUBLIC_URL: "http://vision-agent-new:8080"
      VISION_AGENT_LLM_PROVIDER: "${VISION_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      VISION_AGENT_LLM_MODEL: "${VISION_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      VISION_AGENT_LLM_API_KEY: "${VISION_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      VISION_AGENT_LLM_BASE_URL: "${VISION_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  context-agent-new:
    build:
      context: .
      dockerfile: services/agents/context-agent/Dockerfile
    environment:
      CONTEXT_AGENT_ADDR: ":8080"
      CONTEXT_AGENT_PUBLIC_URL: "http://context-agent-new:8080"
      CONTEXT_AGENT_LLM_PROVIDER: "${CONTEXT_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      CONTEXT_AGENT_LLM_MODEL: "${CONTEXT_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      CONTEXT_AGENT_LLM_API_KEY: "${CONTEXT_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      CONTEXT_AGENT_LLM_BASE_URL: "${CONTEXT_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-agent-new:
    build:
      context: .
      dockerfile: services/agents/test-agent/Dockerfile
    environment:
      TEST_AGENT_ADDR: ":8080"
      TEST_AGENT_PUBLIC_URL: "http://test-agent-new:8080"
      TEST_AGENT_LLM_PROVIDER: "${TEST_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      TEST_AGENT_LLM_MODEL: "${TEST_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      TEST_AGENT_LLM_API_KEY: "${TEST_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      TEST_AGENT_LLM_BASE_URL: "${TEST_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  review-agent-new:
    build:
      context: .
      dockerfile: services/agents/review-agent/Dockerfile
    environment:
      REVIEW_AGENT_ADDR: ":8080"
      REVIEW_AGENT_PUBLIC_URL: "http://review-agent-new:8080"
      REVIEW_AGENT_LLM_PROVIDER: "${REVIEW_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      REVIEW_AGENT_LLM_MODEL: "${REVIEW_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      REVIEW_AGENT_LLM_API_KEY: "${REVIEW_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      REVIEW_AGENT_LLM_BASE_URL: "${REVIEW_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
    ports:
      - "8087:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  security-agent-new:
    build:
      context: .
      dockerfile: services/agents/security-agent/Dockerfile
    environment:
      SECURITY_AGENT_ADDR: ":8080"
      SECURITY_AGENT_PUBLIC_URL: "http://security-agent-new:8080"
      SECURITY_AGENT_LLM_PROVIDER: "${SECURITY_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      SECURITY_AGENT_LLM_MODEL: "${SECURITY_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      SECURITY_AGENT_LLM_API_KEY: "${SECURITY_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      SECURITY_AGENT_LLM_BASE_URL: "${SECURITY_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  deploy-agent-new:
    build:
      context: .
      dockerfile: services/agents/deploy-agent/Dockerfile
    environment:
      DEPLOY_AGENT_ADDR: ":8080"
      DEPLOY_AGENT_PUBLIC_URL: "http://deploy-agent-new:8080"
      DEPLOY_AGENT_LLM_PROVIDER: "${DEPLOY_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      DEPLOY_AGENT_LLM_MODEL: "${DEPLOY_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      DEPLOY_AGENT_LLM_API_KEY: "${DEPLOY_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      DEPLOY_AGENT_LLM_BASE_URL: "${DEPLOY_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  diff-agent-new:
    build:
      context: .
      dockerfile: services/agents/diff-agent/Dockerfile
    environment:
      DIFF_AGENT_ADDR: ":8080"
      DIFF_AGENT_PUBLIC_URL: "http://diff-agent-new:8080"
      DIFF_AGENT_LLM_PROVIDER: "${DIFF_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      DIFF_AGENT_LLM_MODEL: "${DIFF_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      DIFF_AGENT_LLM_API_KEY: "${DIFF_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
      DIFF_AGENT_LLM_BASE_URL: "${DIFF_AGENT_LLM_BASE_URL:-${LLM_BASE_URL}}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
    ports:
      - "8091:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # =========================================================================
  # Orchestrator — depends on code-agent + web-agent (core); others optional
  # =========================================================================

  orchestrator-new:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      ORCHESTRATOR_ADDR: ":8080"
      ORCHESTRATOR_GRPC_ADDR: ":9090"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
      CODE_AGENT_URL: "http://code-agent-new:8080"
      WEB_AGENT_URL: "http://web-agent-new:8080"
      DOCUMENT_AGENT_URL: "http://document-agent-new:8080"
      VISION_AGENT_URL: "http://vision-agent-new:8080"
      CONTEXT_AGENT_URL: "http://context-agent-new:8080"
      TEST_AGENT_URL: "http://test-agent-new:8080"
      REVIEW_AGENT_URL: "http://review-agent-new:8080"
      SECURITY_AGENT_URL: "http://security-agent-new:8080"
      DEPLOY_AGENT_URL: "http://deploy-agent-new:8080"
      DIFF_AGENT_URL: "http://diff-agent-new:8080"
      ORCHESTRATOR_AGENT_CARD_LOAD: "true"
      REQUIRE_PLAN_CONFIRMATION: "${REQUIRE_PLAN_CONFIRMATION:-true}"
      DATABASE_URL: "root:${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}@tcp(mysql:3306)/agenthub?parseTime=true&loc=UTC&charset=utf8mb4"
      REDIS_URL: "redis://redis:6379/0"
      ARTIFACT_STORE_DIR: "/data/artifacts"
      ARTIFACT_BLOB_DIR: "/data/artifacts/blobs"
      PLAYWRIGHT_RENDER_SCRIPT: "/app/render.cjs"
      PLAYWRIGHT_NODE_PATH: "node"
      PLAYWRIGHT_RENDER_TIMEOUT_SECONDS: "${PLAYWRIGHT_RENDER_TIMEOUT_SECONDS:-60}"
      # Object storage stays opt-in: with an empty endpoint the blob store keeps
      # using the local volume, and the default boot path is unchanged.
      ARTIFACT_S3_ENDPOINT: "${ARTIFACT_S3_ENDPOINT:-}"
      ARTIFACT_S3_ACCESS_KEY: "${ARTIFACT_S3_ACCESS_KEY:-}"
      ARTIFACT_S3_SECRET_KEY: "${ARTIFACT_S3_SECRET_KEY:-}"
      ARTIFACT_S3_BUCKET: "${ARTIFACT_S3_BUCKET:-agenthub-artifacts}"
      ARTIFACT_S3_REGION: "${ARTIFACT_S3_REGION:-us-east-1}"
      ARTIFACT_METADATA_BACKEND: "${ARTIFACT_METADATA_BACKEND:-}"
      AGENTHUB_ENV: "docker"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      MEMORY_MODE: "${MEMORY_MODE:-session_only}"
      ORCHESTRATOR_LLM_PROVIDER: "${ORCHESTRATOR_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      ORCHESTRATOR_LLM_MODEL: "${ORCHESTRATOR_LLM_MODEL:-${LLM_MODEL}}"
      ORCHESTRATOR_LLM_API_KEY: "${ORCHESTRATOR_LLM_API_KEY:-${LLM_API_KEY}}"
      ORCHESTRATOR_LLM_BASE_URL: "${ORCHESTRATOR_LLM_BASE_URL:-${LLM_BASE_URL}}"
    ports:
      - "8090:8080"
      - "9090:9090"
    volumes:
      - orchestrator-artifacts:/data/artifacts
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      code-agent-new:
        condition: service_healthy
      web-agent-new:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # =========================================================================
  # Gateway — public REST API + SSE
  # =========================================================================

  gateway-new:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      GATEWAY_ADDR: ":8080"
      ORCHESTRATOR_URL: "http://orchestrator-new:8080"
      ORCHESTRATOR_GRPC_URL: "orchestrator-new:9090"
      ORCHESTRATOR_INTERNAL_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
      GATEWAY_ENABLE_AUTH: "false"
      GATEWAY_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      AGENTHUB_GATEWAY_STORE: "mysql"
      DATABASE_URL: "root:${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}@tcp(mysql:3306)/agenthub?parseTime=true&loc=UTC&charset=utf8mb4"
      # Agent endpoint URLs for frontend agent dropdown display
      CODE_AGENT_URL: "http://code-agent-new:8080"
      WEB_AGENT_URL: "http://web-agent-new:8080"
      DOCUMENT_AGENT_URL: "http://document-agent-new:8080"
      VISION_AGENT_URL: "http://vision-agent-new:8080"
      CONTEXT_AGENT_URL: "http://context-agent-new:8080"
      TEST_AGENT_URL: "http://test-agent-new:8080"
      REVIEW_AGENT_URL: "http://review-agent-new:8080"
      SECURITY_AGENT_URL: "http://security-agent-new:8080"
      DEPLOY_AGENT_URL: "http://deploy-agent-new:8080"
      DIFF_AGENT_URL: "http://diff-agent-new:8080"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      orchestrator-new:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # =========================================================================
  # Nginx — public reverse proxy (API/SSE + frontend, internal paths denied)
  # =========================================================================

  jaeger:
    image: "jaegertracing/all-in-one:1.62.0"
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"

  otel-collector:
    image: "otel/opentelemetry-collector-contrib:0.115.1"
    profiles: ["observability"]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - "./deploy/otel/collector.yaml:/etc/otel/collector.yaml:ro"
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  # Prometheus + Alertmanager + a local webhook receiver. The webhook never
  # forwards anywhere; it only stores payloads for the R0-08 smoke test.
  # PROMETHEUS_CONFIG_FILE / PROMETHEUS_TOKEN_FILE let the smoke test switch to
  # host targets and a temporary internal token without changing this file.
  prometheus:
    image: "prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218"
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - "${PROMETHEUS_CONFIG_FILE:-./deploy/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro"
      - "./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "./deploy/prometheus/alerts-test.yml:/etc/prometheus/alerts-test.yml:ro"
      - "${PROMETHEUS_TOKEN_FILE:-./deploy/prometheus/token.example}:/etc/prometheus/orchestrator-token:ro"
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      alertmanager:
        condition: service_healthy

  alertmanager:
    image: "prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba"
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      # Single instance: gossip settling would drop the first notification.
      - "--cluster.listen-address="
    volumes:
      - "./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 12

  alert-webhook:
    image: "python:3.12-alpine@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8"
    profiles: ["observability"]
    command: ["python", "/app/webhook.py"]
    volumes:
      - "./deploy/alertmanager:/app:ro"
      - alerts-data:/data
    ports:
      - "${ALERT_WEBHOOK_PORT:-18090}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  nginx:
    image: "nginx:1.27-alpine"
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - "./deploy/nginx/agenthub.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      gateway-new:
        condition: service_healthy
      frontend-new:
        condition: service_healthy
    healthcheck:
      # agenthub.conf listens on IPv4 only ("listen 80"); localhost resolves to
      # ::1 inside the container and the probe would always be refused.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================================================
  # Frontend — React dev server
  # =========================================================================

  frontend-new:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AGENTHUB_API_TOKEN: "${AGENTHUB_API_TOKEN:-}"
    depends_on:
      gateway-new:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      # frontend/nginx.conf binds "listen 3000" (IPv4 only), so probing
      # localhost resolves to ::1 and the check always fails.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
