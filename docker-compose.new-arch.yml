  security-agent-new:
    build:
      context: .
      dockerfile: services/agents/security-agent/Dockerfile
    environment:
      SECURITY_AGENT_ADDR: ":8080"
      SECURITY_AGENT_PUBLIC_URL: "http://security-agent-new:8080"
      SECURITY_AGENT_LLM_PROVIDER: "${SECURITY_AGENT_LLM_PROVIDER:-${LLM_PROVIDER:-anthropic}}"
      SECURITY_AGENT_LLM_MODEL: "${SECURITY_AGENT_LLM_MODEL:-${LLM_MODEL}}"
      SECURITY_AGENT_LLM_API_KEY: "${SECURITY_AGENT_LLM_API_KEY:-${LLM_API_KEY}}"
