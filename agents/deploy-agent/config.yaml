name: deploy-agent
description: 用于根据调用方提供的项目状态、环境说明和部署约束生成部署计划、环境检查清单和回滚说明；第一版只生成计划，不执行部署命令。
version: "0.1.0"
url: "http://localhost:8104"
streaming: true
skills:
  - id: deployment_plan
    name: Deployment Plan
    description: 根据项目状态和环境约束生成部署方案和步骤
  - id: environment_checklist
    name: Environment Checklist
    description: 生成部署前环境检查清单和验证项
  - id: rollback_notes
    name: Rollback Notes
    description: 生成部署回滚方案和故障恢复说明
inputModes:
  - text
outputModes:
  - text
  - deployment_plan
supportedInterfaces:
  - type: JSONRPC
    url: "http://localhost:8104"
