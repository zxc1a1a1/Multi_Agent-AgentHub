name: artifact-agent
description: 用于将多个 Agent 的原始输出规整为统一的产物清单，识别产物类型、标题、格式和用途，方便平台后续进行预览、归档和版本管理。
version: "0.1.0"
url: "http://localhost:8096"
streaming: true
skills:
  - id: artifact_manifest
    name: Artifact Manifest
    description: 汇总多个 Agent 输出为统一的产物清单和索引
  - id: artifact_classification
    name: Artifact Classification
    description: 识别和分类产物的类型、格式和用途
inputModes:
  - text
outputModes:
  - text
  - artifact_manifest
supportedInterfaces:
  - type: JSONRPC
    url: "http://localhost:8096"
