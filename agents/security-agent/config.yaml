name: security-agent
description: 用于对调用方提供的文本、diff、命令和 Agent 输出进行安全风险审查，识别密钥泄漏、危险命令和权限边界问题；第一版不读取本地文件系统。
version: "0.1.0"
url: "http://localhost:8097"
skills:
  - secret_scan
  - command_risk_review
  - permission_review
inputModes:
  - text
  - vision_analysis
  - file_summary
  - diff
outputModes:
  - text
  - security_report
streaming: true
