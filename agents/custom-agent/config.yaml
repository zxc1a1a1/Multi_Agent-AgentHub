name: custom-agent
description: 用于承载用户自定义 Agent 的受限任务执行模板，根据调用方提供的角色和任务描述生成安全的文本或文档产物，不允许绕过平台安全边界。
version: "0.1.0"
url: "http://localhost:8084"
streaming: true
skills:
  - id: custom_agent_execution
    name: Custom Agent Execution
    description: 根据用户定义的角色和任务描述执行受限任务
  - id: restricted_profile_task
    name: Restricted Profile Task
    description: 在安全边界内执行受限配置文件的文本/文档生成
inputModes:
  - text
outputModes:
  - text
  - document
supportedInterfaces:
  - type: JSONRPC
    url: "http://localhost:8084"
