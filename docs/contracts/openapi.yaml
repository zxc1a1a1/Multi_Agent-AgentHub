openapi: 3.1.0
info:
  title: AgentHub Gateway Public API
  version: 2.0.0-contract
  description: |
    Gateway-only public API for AgentHub 2.0 multi-conversation IM,
    confirmed LLM planning, registered Agents, events, attachments,
    and versioned artifacts.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Conversations
  - name: Messages
  - name: Runs
  - name: Plans
  - name: Agents
  - name: Agent Registrations
  - name: Attachments
  - name: Artifacts
  - name: Compatibility
paths:
  /health:
    get:
      security: []
      summary: Gateway health check
      responses:
        "200":
          description: Healthy
  /api/conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, deleted]
        - name: mode
          in: query
          schema:
            $ref: "#/components/schemas/ConversationMode"
        - name: agentId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Conversations]
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/Error"
  /api/conversations/search:
    get:
      tags: [Conversations]
      summary: Search authorized conversations and messages
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Search result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultPage"
        default:
          $ref: "#/components/responses/Error"
  /api/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      summary: Get a conversation
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Conversations]
      summary: Update title, mode, response mode, Agents, or context policy
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationRequest"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Conversations]
      summary: Soft-delete a conversation
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /api/conversations/{conversationId}/pin:
    post:
      tags: [Conversations]
      summary: Pin or unpin a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned:
                  type: boolean
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        default:
          $ref: "#/components/responses/Error"
  /api/conversations/{conversationId}/archive:
    post:
      tags: [Conversations]
      summary: Archive a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Archived conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        default:
          $ref: "#/components/responses/Error"
  /api/conversations/{conversationId}/restore:
    post:
      tags: [Conversations]
      summary: Restore an archived or soft-deleted conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Restored conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        default:
          $ref: "#/components/responses/Error"
  /api/conversations/{conversationId}/messages:
    get:
      tags: [Messages]
      summary: List conversation messages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Messages]
      summary: Send a user message and create a Run
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "202":
          description: Message accepted and Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMessageResponse"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/runs/{runId}:
    get:
      tags: [Runs]
      summary: Get Run state
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
  /api/runs/{runId}/cancel:
    post:
      tags: [Runs]
      summary: Cancel a Run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
  /api/runs/{runId}/events:
    get:
      tags: [Runs]
      summary: Replay and stream AG-UI events
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/runs/{runId}/plan:
    get:
      tags: [Plans]
      summary: Get the current Plan and versions for a Run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{planId}/versions:
    post:
      tags: [Plans]
      summary: Create an edited PlanVersion
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanVersionRequest"
      responses:
        "201":
          description: New PlanVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanVersion"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{planId}/confirm:
    post:
      tags: [Plans]
      summary: Confirm the exact PlanVersion
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPlanRequest"
      responses:
        "202":
          description: Confirmation accepted and execution may start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{planId}/reject:
    post:
      tags: [Plans]
      summary: Reject the current PlanVersion
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPlanRequest"
      responses:
        "200":
          description: Plan rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{planId}/regenerate:
    post:
      tags: [Plans]
      summary: Ask Planner to create a new PlanVersion
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegeneratePlanRequest"
      responses:
        "202":
          description: Regeneration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /api/agents:
    get:
      tags: [Agents]
      summary: List visible registered Agents
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: status
          in: query
          schema:
            type: string
        - name: health
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Agent page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPage"
        default:
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [Agents]
      summary: Get a sanitized Agent detail
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Agents]
      summary: Remove an owned remote Agent from future use
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/card:
    get:
      tags: [Agents]
      summary: Get the sanitized stored AgentCard
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Sanitized AgentCard
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/refresh:
    post:
      tags: [Agents]
      summary: Refresh AgentCard and create/update AgentVersion
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "202":
          description: Refresh accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/check:
    post:
      tags: [Agents]
      summary: Run an Agent health check
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "202":
          description: Health check accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/enable:
    post:
      tags: [Agents]
      summary: Enable an owned Agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Enabled Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/disable:
    post:
      tags: [Agents]
      summary: Disable an owned Agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Disabled Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
  /api/agent-registrations:
    post:
      tags: [Agent Registrations]
      summary: Register a remote A2A Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRegistrationRequest"
      responses:
        "202":
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegistration"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/agent-registrations/{registrationId}:
    get:
      tags: [Agent Registrations]
      summary: Get remote Agent registration status
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegistration"
        default:
          $ref: "#/components/responses/Error"
  /api/conversations/{conversationId}/attachments:
    post:
      tags: [Attachments]
      summary: Upload an attachment
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        default:
          $ref: "#/components/responses/Error"
  /api/attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Attachments]
      summary: Get authorized attachment metadata or content
      responses:
        "200":
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Attachments]
      summary: Delete an attachment
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /api/conversations/{conversationId}/artifacts:
    get:
      tags: [Artifacts]
      summary: List conversation artifacts
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Artifact page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
        default:
          $ref: "#/components/responses/Error"
  /api/artifacts/{artifactId}:
    get:
      tags: [Artifacts]
      summary: Get an artifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        default:
          $ref: "#/components/responses/Error"
  /api/artifacts/{artifactId}/versions:
    get:
      tags: [Artifacts]
      summary: List artifact versions
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Artifact version page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactVersionPage"
        default:
          $ref: "#/components/responses/Error"
  /api/artifacts/{artifactId}/restore:
    post:
      tags: [Artifacts]
      summary: Restore a prior artifact version as a new version
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Restored artifact version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactVersion"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /agui/runs:
    post:
      deprecated: true
      tags: [Compatibility]
      summary: Deprecated compatibility run endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/chat:
    post:
      deprecated: true
      tags: [Compatibility]
      summary: Deprecated compatibility chat endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageToken:
      name: pageToken
      in: query
      schema:
        type: string
    IfMatchVersion:
      name: If-Match
      in: header
      description: Conversation optimistic concurrency version
      schema:
        type: string
  responses:
    Error:
      description: Sanitized error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ConversationMode:
      type: string
      enum: [direct, manual_multi, auto]
    ResponseMode:
      type: string
      enum: [separate, synthesize]
    ConversationStatus:
      type: string
      enum: [active, archived, deleted]
    CreateConversationRequest:
      type: object
      required: [mode]
      properties:
        title:
          type: string
          maxLength: 120
        mode:
          $ref: "#/components/schemas/ConversationMode"
        responseMode:
          $ref: "#/components/schemas/ResponseMode"
        agentIds:
          type: array
          uniqueItems: true
          items:
            type: string
        contextPolicy:
          type: object
          additionalProperties: true
    UpdateConversationRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        mode:
          $ref: "#/components/schemas/ConversationMode"
        responseMode:
          $ref: "#/components/schemas/ResponseMode"
        agentIds:
          type: array
          uniqueItems: true
          items:
            type: string
        contextPolicy:
          type: object
          additionalProperties: true
    Conversation:
      type: object
      required: [id, mode, responseMode, status, version, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        mode:
          $ref: "#/components/schemas/ConversationMode"
        responseMode:
          $ref: "#/components/schemas/ResponseMode"
        status:
          $ref: "#/components/schemas/ConversationStatus"
        agentIds:
          type: array
          items:
            type: string
        version:
          type: integer
        pinnedAt:
          type: [string, "null"]
          format: date-time
        archivedAt:
          type: [string, "null"]
          format: date-time
        lastMessageAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        nextPageToken:
          type: [string, "null"]
    Message:
      type: object
      required: [id, conversationId, senderType, messageType, status, sequence, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        runId:
          type: [string, "null"]
        senderType:
          type: string
          enum: [user, agent, system]
        senderId:
          type: [string, "null"]
        messageType:
          type: string
          enum: [text, plan_card, artifact_card, error, notice]
        contentText:
          type: string
        contentJson:
          type: object
          additionalProperties: true
        status:
          type: string
        sequence:
          type: integer
        createdAt:
          type: string
          format: date-time
    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextPageToken:
          type: [string, "null"]
    CreateMessageRequest:
      type: object
      required: [clientMessageId, content]
      properties:
        clientMessageId:
          type: string
          minLength: 1
        content:
          type: string
        attachmentIds:
          type: array
          items:
            type: string
        modeOverride:
          $ref: "#/components/schemas/ConversationMode"
        agentIds:
          type: array
          uniqueItems: true
          items:
            type: string
        responseMode:
          $ref: "#/components/schemas/ResponseMode"
        activeRunBehavior:
          type: string
          enum: [queue, cancel_current, human_input]
    CreateMessageResponse:
      type: object
      required: [message, run]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        run:
          $ref: "#/components/schemas/Run"
    Run:
      type: object
      required: [id, conversationId, mode, status, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        triggerMessageId:
          type: string
        mode:
          $ref: "#/components/schemas/ConversationMode"
        status:
          type: string
          enum:
            - pending
            - planning
            - awaiting_confirmation
            - executing
            - synthesizing
            - completed
            - partial_failure
            - failed
            - canceled
        planId:
          type: [string, "null"]
        confirmedPlanVersion:
          type: [integer, "null"]
        errorCode:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    PlanStep:
      type: object
      required: [stepId, agentId, title, instruction, dependsOn]
      properties:
        stepId:
          type: string
        agentId:
          type: string
        agentVersion:
          type: [string, "null"]
        skillId:
          type: [string, "null"]
        title:
          type: string
        instruction:
          type: string
        dependsOn:
          type: array
          items:
            type: string
        expectedOutput:
          type: object
          additionalProperties: true
    PlanVersion:
      type: object
      required: [planId, version, goal, status, steps, responseMode, createdAt]
      properties:
        planId:
          type: string
        version:
          type: integer
        goal:
          type: string
        status:
          type: string
          enum:
            - draft
            - awaiting_confirmation
