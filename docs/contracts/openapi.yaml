openapi: 3.1.0
info:
  title: AgentHub Gateway Public API
  version: 1.0.0-new-arch
  description: Gateway-only public API for the Module Separation & Runtime Redesign architecture.
servers:
  - url: http://localhost:8080
paths:
  /agui/runs:
    post:
      summary: Start an AG-UI run and stream events with SSE
      operationId: startAguiRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: SSE stream of AG-UI events
          content:
            text/event-stream:
              schema:
                type: string
  /api/chat:
    post:
      summary: Temporary compatibility wrapper over /agui/runs
      x-agenthub-status: temporary-compatibility
      responses:
        '200': { description: SSE stream }
  /api/conversations:
    get:
      summary: List conversations
      responses:
        '200': { description: Conversation list }
    post:
      summary: Create conversation
      responses:
        '201': { description: Created conversation }
  /api/conversations/{id}/messages:
    get:
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Message list }
  /api/agents:
    get:
      summary: List available agents via Orchestrator
      responses:
        '200': { description: Agent list }
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: Healthy }
components:
  schemas:
    RunRequest:
      type: object
      required: [threadId, messages]
      properties:
        threadId: { type: string }
        runId: { type: string }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant, system, tool] }
              content: { type: string }
              senderName: { type: string }
        tools:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              description: { type: string }
              schema_json: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
