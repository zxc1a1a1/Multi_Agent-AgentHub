# AgentHub Prometheus scrape configuration (compose network).
# The Orchestrator token file is mounted at /etc/prometheus/orchestrator-token
# with mode 0600; never commit the token itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["gateway-new:8080"]

  - job_name: orchestrator
    metrics_path: /internal/orchestrator/metrics
    params:
      window: ["1h"]
      format: ["prometheus"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/orchestrator-token
    static_configs:
      - targets: ["orchestrator-new:8080"]

  - job_name: orchestrator-routing
    metrics_path: /internal/orchestrator/metrics/routing
    params:
      window: ["1h"]
      format: ["prometheus"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/orchestrator-token
    static_configs:
      - targets: ["orchestrator-new:8080"]
