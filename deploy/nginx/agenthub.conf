# AgentHub single-node reverse proxy.
# Public surface: /api/* -> Gateway, everything else -> frontend.
# /internal/* is never exposed; internal service calls stay on the compose network.

upstream agenthub_gateway {
    server gateway-new:8080;
    keepalive 32;
}

upstream agenthub_frontend {
    server frontend-new:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # SSE/run stream: disable buffering and allow long-lived connections.
    location /api/ {
        proxy_pass http://agenthub_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location = /health {
        proxy_pass http://agenthub_gateway;
        proxy_set_header Host $host;
        access_log off;
    }

    # Internal Orchestrator/Gateway endpoints must not be reachable publicly.
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://agenthub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
