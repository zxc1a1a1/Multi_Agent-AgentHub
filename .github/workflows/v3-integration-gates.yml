name: V3 Integration Gates

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: agenthub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      AGENTHUB_MYSQL_TEST_DSN: root:ci-only-password@tcp(127.0.0.1:3306)/agenthub_test?parseTime=true&loc=UTC
      AGENTHUB_REDIS_TEST_ADDR: 127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/orchestrator/go.mod
          cache: false

      - name: Go version
        run: go version

      - name: Run integration gate with evidence collection
        run: >-
          bash scripts/run-integration-evidence.sh
          --test-id R0-01 --plan-task R0-01
          --packages "./services/orchestrator/... ./services/gateway/..."
          --run '^TestIntegration'
          --timeout 25m
          --out "docs/reports/evidence/ci-${{ github.run_number }}/R0-01"

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence-${{ github.run_number }}
          path: docs/reports/evidence/ci-${{ github.run_number }}
          if-no-files-found: warn

      - name: Show evidence summary on failure
        if: failure()
        run: |
          cat docs/reports/evidence/ci-${{ github.run_number }}/R0-01/summary.md || true
          tail -n 200 docs/reports/evidence/ci-${{ github.run_number }}/R0-01/logs/go-test-stderr.txt || true

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: pkg/adk
          - module: pkg/runtime
          - module: services/gateway
            build: ./cmd/gateway
          - module: services/orchestrator
            build: ./cmd/orchestrator
          - module: services/agents/code-agent
            build: ./cmd/code-agent
          - module: services/agents/web-agent
            build: ./cmd/web-agent
          - module: services/agents/test-agent
          - module: services/agents/security-agent
          - module: services/agents/diff-agent
          - module: services/agents/markdown-agent
          - module: services/agents/review-agent
          - module: services/agents/document-agent
          - module: services/agents/vision-agent
          - module: services/agents/context-agent
          - module: services/agents/deploy-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/orchestrator/go.mod
          cache: false
      - name: Test and build
        run: |
          set -euo pipefail
          cd "${{ matrix.module }}"
          go test ./... -count=1
          if [ -n "${{ matrix.build }}" ]; then
            go build "${{ matrix.build }}"
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run group chat E2E
        working-directory: frontend
        run: npx playwright test e2e/group-chat.spec.ts --reporter=list
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  config-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate compose file
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          AGENTHUB_API_TOKEN: ci-only-token
        run: docker compose -f docker-compose.new-arch.yml config --quiet
      - name: Check Dockerfiles copy all workspace modules
        run: |
          python3 - <<'PY'
          import pathlib
          modules = [line.strip()[2:] for line in open('go.work') if line.strip().startswith('./')]
          failures = []
          for dockerfile in pathlib.Path('.').glob('services/**/Dockerfile'):
              text = dockerfile.read_text()
              if 'go.work' not in text:
                  continue
              missing = [f'{m}/go.mod' for m in modules if f'{m}/go.mod' not in text]
              missing += [f'{m}/go.sum' for m in modules
                          if (pathlib.Path(m) / 'go.sum').exists() and f'{m}/go.sum' not in text]
              if 'ca-certificates' not in text:
                  missing.append('runtime ca-certificates')
              if missing:
                  failures.append(f'{dockerfile}: missing {missing}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('all Dockerfiles copy workspace module files')
          PY

      - name: Validate Prometheus config
        run: >-
          docker run --rm
          -v "$PWD/deploy/prometheus:/etc/prometheus:ro"
          --entrypoint sh
          prom/prometheus:v3.1.0
          -c 'echo ci-token > /tmp/orchestrator-token
          && cp /etc/prometheus/prometheus.yml /tmp/prometheus.yml
          && sed -i "s#/etc/prometheus/orchestrator-token#/tmp/orchestrator-token#" /tmp/prometheus.yml
          && promtool check config /tmp/prometheus.yml'
      - name: Validate Prometheus alert rules
        run: >-
          docker run --rm
          -v "$PWD/deploy/prometheus:/etc/prometheus:ro"
          --entrypoint promtool
          prom/prometheus:v3.1.0
          check rules /etc/prometheus/alerts.yml
      - name: Validate nginx config
        run: >-
          docker run --rm
          --add-host gateway-new:127.0.0.1
          --add-host frontend-new:127.0.0.1
          -v "$PWD/deploy/nginx/agenthub.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine
          nginx -t
