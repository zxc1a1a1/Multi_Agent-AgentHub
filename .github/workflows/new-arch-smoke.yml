name: New Architecture Smoke

on:
  push:
    branches:
      - y
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show tool versions
        run: |
          go version
          docker version
          docker compose version

      - name: Run Go tests
        run: |
          go test ./services/orchestrator/... ./services/gateway/... -count=1

      - name: Check compose config
        run: |
          docker compose -f docker-compose.new-arch.yml config --services

          echo "## gateway env direct agent URL check"
          if docker compose -f docker-compose.new-arch.yml config \
            | sed -n '/gateway-new:/,/orchestrator-new:/p' \
            | grep -E "AGENT_CODE_URL|AGENT_WEB_URL|CODE_AGENT_URL|WEB_AGENT_URL"; then
            echo "gateway-new must not contain direct agent URLs"
            exit 1
          fi

          echo "## orchestrator env agent URL check"
          docker compose -f docker-compose.new-arch.yml config \
            | sed -n '/orchestrator-new:/,/ports:/p' \
            | grep -E "CODE_AGENT_URL|WEB_AGENT_URL|INTERNAL_SERVICE_TOKEN"

      - name: Start new architecture
        run: |
          docker compose -f docker-compose.new-arch.yml up --build -d

      - name: Show compose status
        run: |
          docker compose -f docker-compose.new-arch.yml ps

      - name: Wait briefly for services
        run: |
          sleep 10
          docker compose -f docker-compose.new-arch.yml ps

      - name: Run smoke test
        run: |
          chmod +x ./smoke-new-arch.sh
          ./smoke-new-arch.sh

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.new-arch.yml ps
          docker compose -f docker-compose.new-arch.yml logs --no-color

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.new-arch.yml down -v
