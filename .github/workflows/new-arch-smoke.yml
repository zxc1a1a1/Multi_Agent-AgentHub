name: New Architecture Smoke

on:
  push:
    branches:
      - y
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show tool versions
        run: |
          go version
          docker version
          docker compose version

      - name: Run Go tests
        run: |
          go test ./services/orchestrator/... ./services/gateway/... -count=1

      - name: Check compose config
        run: |
          docker compose -f docker-compose.new-arch.yml config --services

          echo "## gateway env direct agent URL check"
          if docker compose -f docker-compose.new-arch.yml config \
            | sed -n '/gateway-new:/,/orchestrator-new:/p' \
            | grep -E "AGENT_CODE_URL|AGENT_WEB_URL|CODE_AGENT_URL|WEB_AGENT_URL"; then
            echo "gateway-new must not contain direct agent URLs"
            exit 1
          fi

          echo "## orchestrator env agent URL check"
          docker compose -f docker-compose.new-arch.yml config \
            | sed -n '/orchestrator-new:/,/ports:/p' \
            | grep -E "CODE_AGENT_URL|WEB_AGENT_URL|INTERNAL_SERVICE_TOKEN"

      - name: Start new architecture
        run: |
          docker compose -f docker-compose.new-arch.yml up --build -d

      - name: Show compose status
        run: |
          docker compose -f docker-compose.new-arch.yml ps

      - name: Wait briefly for services
        run: |
          sleep 10
          docker compose -f docker-compose.new-arch.yml ps

      - name: Debug raw gateway responses
        run: |
          echo "## gateway health"
          curl -i http://localhost:8080/health || true

          echo
          echo "## create smoke conversations"

          CODE_CONV_ID=$(curl -sS -X POST http://localhost:8080/api/conversations \
            -H 'Content-Type: application/json' \
            -d '{"userId":"smoke-user","agentName":"code-agent"}' \
            | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          echo "code conv id=$CODE_CONV_ID"

          WEB_CONV_ID=$(curl -sS -X POST http://localhost:8080/api/conversations \
            -H 'Content-Type: application/json' \
            -d '{"userId":"smoke-user","agentName":"web-agent"}' \
            | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          echo "web conv id=$WEB_CONV_ID"

          MIXED_CONV_ID=$(curl -sS -X POST http://localhost:8080/api/conversations \
            -H 'Content-Type: application/json' \
            -d '{"userId":"smoke-user","agentName":"code-agent"}' \
            | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          echo "mixed conv id=$MIXED_CONV_ID"

          echo
          echo "## single code raw response"
          curl -i -N \
            -H "Content-Type: application/json" \
            -X POST http://localhost:8080/api/chat \
            -d "{\"conversationId\":\"$CODE_CONV_ID\",\"message\":\"用 Go 写一个 HTTP API 接口\",\"agentName\":\"code-agent\"}" \
            | tee /tmp/smoke-code.out

          echo
          echo "## single web raw response"
          curl -i -N \
            -H "Content-Type: application/json" \
            -X POST http://localhost:8080/api/chat \
            -d "{\"conversationId\":\"$WEB_CONV_ID\",\"message\":\"写一个 HTML 登录页面\",\"agentName\":\"web-agent\"}" \
            | tee /tmp/smoke-web.out

          echo
          echo "## mixed raw response"
          curl -i -N \
            -H "Content-Type: application/json" \
            -X POST http://localhost:8080/api/chat \
            -d "{\"conversationId\":\"$MIXED_CONV_ID\",\"message\":\"写一个 HTML 登录页面，并实现 Go API 接口\"}" \
            | tee /tmp/smoke-mixed.out

          echo
          echo "## useful markers"
          grep -E "HTTP/|data:|event:|run_error|error|code-agent|web-agent|orchestrator|sender|author|AGENT|DISPATCH|PLAN|TOKEN|unauthorized|forbidden" /tmp/smoke-*.out || true

      - name: Run smoke test
        run: |
          chmod +x ./smoke-new-arch.sh
          ./smoke-new-arch.sh

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.new-arch.yml ps
          docker compose -f docker-compose.new-arch.yml logs --no-color

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.new-arch.yml down -v
